<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#111820" />
    <title>Sem conexão | Prime Ges</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111820; color: #e8eef5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
      img { width: 88px; height: 88px; border-radius: 20px; }
      h1 { font-size: 1.35rem; margin: 1.25rem 0 .5rem; }
      p { margin: 0 0 1.5rem; color: #a9b8c9; line-height: 1.5; }
      button { background: #0f6fd1; color: #fff; border: 0; border-radius: .6rem; padding: .8rem 1.4rem; font-size: 1rem; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid #168bff; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="88" height="88" />
      <h1>Você está sem conexão</h1>
      <p>O Prime Ges precisa de internet para mostrar seus dados com segurança. Confira o Wi-Fi ou o sinal do celular e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
